name: keyshortcuts
description: Free MCP server for keyboard shortcuts — search 2,719 records across 7 platforms (Windows, macOS, Linux, ChromeOS, iOS, Android) and 45 apps (VS Code, Excel, Figma, Photoshop, Notion, Slack, Vim, IntelliJ IDEA, Cursor, and more). Look up what a key combination does, compare actions across platforms, and translate bindings between Windows and macOS. No API key required.
